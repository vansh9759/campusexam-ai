services:
  # ==============================================================================
  # CampusExam AI - Unified Full-Stack Web Service (Render Free Tier Compatible)
  # ==============================================================================
  - type: web
    name: campusexam-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render:build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
      - key: CLIENT_ORIGIN
        value: '*'
